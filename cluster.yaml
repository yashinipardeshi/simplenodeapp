apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: learn-eks
  region: ap-south-1
  version: "1.36"

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP

iam:
  withOIDC: true

managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    privateNetworking: false

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: metrics-server
  - name: amazon-cloudwatch-observability
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
